# A local database for memindex: `docker compose up -d`, then paste into `memindex install`:
#   postgresql://memindex:memindex@127.0.0.1:54329/memindex
services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    # Image defaults (128MB shared_buffers, 4MB work_mem) leave a multi-GB archive's indexes on disk.
    # Sized for Docker Desktop's default 8 GB VM; scale with it.
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=5GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
    shm_size: 2gb
    environment:
      POSTGRES_USER: memindex
      POSTGRES_PASSWORD: memindex
      POSTGRES_DB: memindex
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - memindex-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memindex -d memindex"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  memindex-db:
